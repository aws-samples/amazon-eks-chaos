# ApplicationSet that reads GitOps Bridge cluster secret annotations
# to determine which addons to deploy. Uses a matrix generator with
# cluster secrets and a list of addon definitions.
#
# Per-addon Helm values (IRSA, cluster config) are injected via templatePatch.
#
# IMPORTANT for ArgoCD EKS Capability:
#   - Server must be the cluster ARN (not https://kubernetes.default.svc)
#   - ArgoCD capability IAM role needs AmazonEKSClusterAdminPolicy
#   - AppProjects need sourceNamespaces: [argocd]
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-addons
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
          - list:
              elements:
                - addon: aws-load-balancer-controller
                  namespace: kube-system
                  chart: aws-load-balancer-controller
                  repo: https://aws.github.io/eks-charts
                  version: "1.16.0"
                - addon: metrics-server
                  namespace: kube-system
                  chart: metrics-server
                  repo: https://kubernetes-sigs.github.io/metrics-server
                  version: "3.13.0"
                - addon: cluster-autoscaler
                  namespace: kube-system
                  chart: cluster-autoscaler
                  repo: https://kubernetes.github.io/autoscaler
                  version: "9.44.0"
                - addon: external-dns
                  namespace: external-dns
                  chart: external-dns
                  repo: https://kubernetes-sigs.github.io/external-dns
                  version: "1.15.1"
                - addon: cert-manager
                  namespace: cert-manager
                  chart: cert-manager
                  repo: https://charts.jetstack.io
                  version: "1.17.1"
                - addon: external-secrets
                  namespace: external-secrets
                  chart: external-secrets
                  repo: https://charts.external-secrets.io
                  version: "0.20.1"
                - addon: kyverno
                  namespace: kyverno
                  chart: kyverno
                  repo: https://kyverno.github.io/kyverno/
                  version: "3.5.2"
                - addon: gatekeeper
                  namespace: gatekeeper-system
                  chart: gatekeeper
                  repo: https://open-policy-agent.github.io/gatekeeper/charts
                  version: "3.18.2"
                - addon: velero
                  namespace: velero
                  chart: velero
                  repo: https://vmware-tanzu.github.io/helm-charts
                  version: "11.3.2"
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  template:
    metadata:
      name: '{{ .addon }}'
    spec:
      project: cluster-addons
      source:
        repoURL: '{{ .repo }}'
        chart: '{{ .chart }}'
        targetRevision: '{{ .version }}'
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
  # Per-addon Helm values injected via Go template patch.
  # Reads IRSA ARNs and cluster metadata from GitOps Bridge cluster secret annotations.
  # Annotation key names come from eks-blueprints-addons gitops_metadata output.
  templatePatch: |
    {{- if eq .addon "aws-load-balancer-controller" }}
    spec:
      source:
        helm:
          valuesObject:
            clusterName: {{ .metadata.annotations.cluster_name }}
            region: {{ .metadata.annotations.aws_region }}
            vpcId: {{ .metadata.annotations.vpc_id }}
            serviceAccount:
              create: true
              name: {{ .metadata.annotations.aws_load_balancer_controller_service_account }}
              annotations:
                eks.amazonaws.com/role-arn: {{ .metadata.annotations.aws_load_balancer_controller_iam_role_arn }}
    {{- end }}
    {{- if eq .addon "cluster-autoscaler" }}
    spec:
      source:
        helm:
          valuesObject:
            autoDiscovery:
              clusterName: {{ .metadata.annotations.cluster_name }}
            awsRegion: {{ .metadata.annotations.aws_region }}
            rbac:
              serviceAccount:
                name: {{ .metadata.annotations.cluster_autoscaler_service_account }}
                annotations:
                  eks.amazonaws.com/role-arn: {{ .metadata.annotations.cluster_autoscaler_iam_role_arn }}
    {{- end }}
    {{- if eq .addon "karpenter" }}
    spec:
      source:
        helm:
          valuesObject:
            settings:
              clusterName: {{ .metadata.annotations.cluster_name }}
            serviceAccount:
              annotations:
                eks.amazonaws.com/role-arn: {{ .metadata.annotations.karpenter_iam_role_arn }}
    {{- end }}
    {{- if eq .addon "external-dns" }}
    spec:
      source:
        helm:
          valuesObject:
            serviceAccount:
              annotations:
                eks.amazonaws.com/role-arn: {{ .metadata.annotations.external_dns_iam_role_arn }}
    {{- end }}
    {{- if eq .addon "cert-manager" }}
    spec:
      source:
        helm:
          valuesObject:
            installCRDs: true
            serviceAccount:
              annotations:
                eks.amazonaws.com/role-arn: {{ .metadata.annotations.cert_manager_iam_role_arn }}
    {{- end }}
    {{- if eq .addon "external-secrets" }}
    spec:
      source:
        helm:
          valuesObject:
            serviceAccount:
              annotations:
                eks.amazonaws.com/role-arn: {{ .metadata.annotations.external_secrets_iam_role_arn }}
    {{- end }}
    {{- if eq .addon "kyverno" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - Replace=true
    {{- end }}
    {{- if eq .addon "velero" }}
    spec:
      source:
        helm:
          valuesObject:
            credentials:
              useSecret: false
            serviceAccount:
              server:
                create: true
                name: velero-server
            upgradeCRDs: false
            kubectl:
              image:
                repository: bitnami/kubectl
                tag: "1.31"
            configuration:
              backupStorageLocation:
                - provider: aws
                  bucket: {{ .metadata.annotations.cluster_name }}-velero-backups-{{ .metadata.annotations.aws_account_id }}
                  config:
                    region: {{ .metadata.annotations.aws_region }}
              volumeSnapshotLocation:
                - provider: aws
                  config:
                    region: {{ .metadata.annotations.aws_region }}
            initContainers:
              - name: velero-plugin-for-aws
                image: velero/velero-plugin-for-aws:v1.13.1
                volumeMounts:
                  - mountPath: /target
                    name: plugins
    {{- end }}
