# Pattern 2b ApplicationSet — ArgoCD + Crossplane
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-addons
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
          - list:
              elements:
                - addon: crossplane
                  namespace: crossplane-system
                  chart: crossplane
                  repo: https://charts.crossplane.io/stable
                  version: "2.2.0"
                - addon: aws-load-balancer-controller
                  namespace: kube-system
                  chart: aws-load-balancer-controller
                  repo: https://aws.github.io/eks-charts
                  version: "1.12.0"
                - addon: metrics-server
                  namespace: kube-system
                  chart: metrics-server
                  repo: https://kubernetes-sigs.github.io/metrics-server
                  version: "3.12.2"
                - addon: karpenter
                  namespace: kube-system
                  chart: karpenter
                  repo: oci://public.ecr.aws/karpenter
                  version: "1.8.2"
                - addon: external-dns
                  namespace: external-dns
                  chart: external-dns
                  repo: https://kubernetes-sigs.github.io/external-dns
                  version: "1.19.0"
                - addon: cert-manager
                  namespace: cert-manager
                  chart: cert-manager
                  repo: https://charts.jetstack.io
                  version: "1.17.1"
                - addon: external-secrets
                  namespace: external-secrets
                  chart: external-secrets
                  repo: https://charts.external-secrets.io
                  version: "0.14.4"
                - addon: kyverno
                  namespace: kyverno
                  chart: kyverno
                  repo: https://kyverno.github.io/kyverno/
                  version: "3.3.4"
                - addon: velero
                  namespace: velero
                  chart: velero
                  repo: https://vmware-tanzu.github.io/helm-charts
                  version: "8.3.0"
                - addon: aws-for-fluent-bit
                  namespace: logging
                  chart: aws-for-fluent-bit
                  repo: https://aws.github.io/eks-charts
                  version: "0.1.34"
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  template:
    metadata:
      name: '{{ .addon }}'
    spec:
      project: cluster-addons
      source:
        repoURL: '{{ .repo }}'
        chart: '{{ .chart }}'
        targetRevision: '{{ .version }}'
      destination:
        server: '{{ .server }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
  templatePatch: |
    {{- if eq .addon "aws-load-balancer-controller" }}
    spec:
      source:
        helm:
          valuesObject:
            clusterName: {{ .metadata.annotations.cluster_name }}
            region: {{ .metadata.annotations.aws_region }}
            vpcId: {{ .metadata.annotations.vpc_id }}
    {{- end }}
    {{- if eq .addon "karpenter" }}
    spec:
      source:
        helm:
          valuesObject:
            settings:
              clusterName: {{ .metadata.annotations.cluster_name }}
    {{- end }}
    {{- if eq .addon "cert-manager" }}
    spec:
      source:
        helm:
          valuesObject:
            installCRDs: true
    {{- end }}
    {{- if eq .addon "kyverno" }}
    spec:
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - Replace=true
    {{- end }}
    {{- if eq .addon "velero" }}
    spec:
      source:
        helm:
          valuesObject:
            credentials:
              useSecret: false
            serviceAccount:
              server:
                create: true
                name: velero-server
            upgradeCRDs: false
            kubectl:
              image:
                repository: bitnami/kubectl
                tag: "1.31"
            configuration:
              backupStorageLocation:
                - provider: aws
                  bucket: {{ .metadata.annotations.cluster_name }}-velero-backups-{{ .metadata.annotations.aws_account_id }}
                  config:
                    region: {{ .metadata.annotations.aws_region }}
              volumeSnapshotLocation:
                - provider: aws
                  config:
                    region: {{ .metadata.annotations.aws_region }}
            initContainers:
              - name: velero-plugin-for-aws
                image: velero/velero-plugin-for-aws:v1.13.1
                volumeMounts:
                  - mountPath: /target
                    name: plugins
    {{- end }}
    {{- if eq .addon "aws-for-fluent-bit" }}
    spec:
      source:
        helm:
          valuesObject:
            cloudWatchLogs:
              enabled: true
              region: {{ .metadata.annotations.aws_region }}
              logGroupName: /aws/eks/{{ .metadata.annotations.cluster_name }}/fluent-bit
              autoCreateGroup: true
    {{- end }}
