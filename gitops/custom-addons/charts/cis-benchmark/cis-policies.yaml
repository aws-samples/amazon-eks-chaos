# CIS 5.1.5 - No hostPID, hostIPC, or hostNetwork
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cis-5-1-5-disallow-host-namespaces
  annotations:
    policies.kyverno.io/title: Disallow host namespaces
    policies.kyverno.io/category: CIS EKS Benchmark v1.8.0
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      CIS 5.1.5 - Pods must not use host PID, IPC, or network namespaces.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: disallow-host-namespaces
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
                - gatekeeper-system
                - monitoring
                - logging
      validate:
        message: "Host namespaces (hostPID, hostIPC, hostNetwork) are not allowed (CIS 5.1.5)."
        pattern:
          spec:
            =(hostPID): false
            =(hostIPC): false
            =(hostNetwork): false
---
# CIS 5.1.6 - Drop ALL capabilities, only allow NET_BIND_SERVICE
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cis-5-1-6-restrict-capabilities
  annotations:
    policies.kyverno.io/title: Restrict container capabilities
    policies.kyverno.io/category: CIS EKS Benchmark v1.8.0
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      CIS 5.1.6 - Containers must drop ALL capabilities and may only add
      NET_BIND_SERVICE.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-drop-all
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
                - gatekeeper-system
                - monitoring
                - logging
      validate:
        message: >-
          Containers must drop ALL capabilities (CIS 5.1.6). Only
          NET_BIND_SERVICE may be added.
        pattern:
          spec:
            containers:
              - securityContext:
                  capabilities:
                    drop:
                      - ALL
                    =(add):
                      - NET_BIND_SERVICE
---
