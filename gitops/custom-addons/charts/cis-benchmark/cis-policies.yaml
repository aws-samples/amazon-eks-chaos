# CIS EKS Benchmark v1.8.0 - Kyverno ClusterPolicies
#
# 16 policies covering CIS Amazon EKS Benchmark v1.8.0 (Sections 4 & 5).
# All policies default to Audit mode. Change validationFailureAction to
# "Enforce" when ready.
#
# Excluded namespaces: kube-system, kube-public, kube-node-lease, kyverno,
# gatekeeper-system, monitoring, logging

# ==========================================================================
# Section 4 - RBAC & Service Accounts
# ==========================================================================

# CIS 4.1.1 - Restrict ClusterRoleBinding to cluster-admin
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cis-4-1-1-restrict-cluster-admin-binding
  annotations:
    policies.kyverno.io/title: Restrict cluster-admin ClusterRoleBinding
    policies.kyverno.io/category: CIS EKS Benchmark v1.8.0
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      CIS 4.1.1 - Restrict creation of ClusterRoleBindings to the
      cluster-admin ClusterRole.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: restrict-cluster-admin-binding
      match:
        any:
          - resources:
              kinds:
                - ClusterRoleBinding
      validate:
        message: "Binding to the cluster-admin ClusterRole is restricted (CIS 4.1.1)."
        deny:
          conditions:
            all:
              - key: "{{ request.object.roleRef.name }}"
                operator: Equals
                value: cluster-admin
---
# CIS 4.1.5 - Prevent default ServiceAccount token auto-mount
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cis-4-1-5-disallow-default-sa-token
  annotations:
    policies.kyverno.io/title: Disallow default ServiceAccount token auto-mount
    policies.kyverno.io/category: CIS EKS Benchmark v1.8.0
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      CIS 4.1.5 - Pods should not auto-mount the default ServiceAccount token.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: disallow-default-sa-token
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
                - gatekeeper-system
                - monitoring
                - logging
      validate:
        message: >-
          Default ServiceAccount token auto-mounting must be disabled (CIS 4.1.5).
          Set automountServiceAccountToken: false or use a dedicated ServiceAccount.
        pattern:
          spec:
            automountServiceAccountToken: false
---
# CIS 4.1.6 - Prevent pods from using default ServiceAccount
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cis-4-1-6-disallow-default-sa-usage
  annotations:
    policies.kyverno.io/title: Disallow use of default ServiceAccount
    policies.kyverno.io/category: CIS EKS Benchmark v1.8.0
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      CIS 4.1.6 - Pods should not use the default ServiceAccount.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: disallow-default-sa-usage
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
                - gatekeeper-system
                - monitoring
                - logging
      validate:
        message: "Pods must not use the 'default' ServiceAccount (CIS 4.1.6)."
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.serviceAccountName || 'default' }}"
                operator: Equals
                value: default
---
# ==========================================================================
# Section 5 - Pod Security
# ==========================================================================

# CIS 5.1.1 - Containers must not run as root
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cis-5-1-1-require-non-root-containers
  annotations:
    policies.kyverno.io/title: Require non-root containers
    policies.kyverno.io/category: CIS EKS Benchmark v1.8.0
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      CIS 5.1.1 - Containers must run as non-root. Set runAsNonRoot: true.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
                - gatekeeper-system
                - monitoring
                - logging
      validate:
        message: >-
          Containers must not run as root (CIS 5.1.1). Set
          spec.securityContext.runAsNonRoot or
          spec.containers[*].securityContext.runAsNonRoot to true.
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
          - spec:
              containers:
                - securityContext:
                    runAsNonRoot: true
---
