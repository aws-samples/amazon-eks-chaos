# ACK-managed Velero S3 bucket for backup storage.
#
# The IAM role and Pod Identity Association are managed by Terraform.
# ACK creates only the S3 bucket with encryption and public access blocked.
#
# Values are injected by ArgoCD from GitOps Bridge cluster secret annotations
# via the custom-addons ApplicationSet templatePatch.
---
apiVersion: s3.services.k8s.aws/v1alpha1
kind: Bucket
metadata:
  name: {{ .Values.clusterName }}-velero-backups
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: ack
    app.kubernetes.io/part-of: velero-infra
spec:
  name: {{ .Values.clusterName }}-velero-backups-{{ .Values.accountId }}
  encryption:
    rules:
      - applyServerSideEncryptionByDefault:
          sseAlgorithm: AES256
        bucketKeyEnabled: true
  publicAccessBlock:
    blockPublicACLs: true
    blockPublicPolicy: true
    ignorePublicACLs: true
    restrictPublicBuckets: true
  tagging:
    tagSet:
      - key: ManagedBy
        value: ACK
      - key: Cluster
        value: {{ .Values.clusterName }}
